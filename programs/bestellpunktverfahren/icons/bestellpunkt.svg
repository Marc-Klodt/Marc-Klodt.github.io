<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bestellpunktverfahren">
  <defs>
    <radialGradient id="face-black" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#1a2330"/>
      <stop offset="55%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="rim-cyan" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="18%" stop-color="#67f8ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rim-lime" x1="56" y1="6" x2="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d9ff9a"/>
      <stop offset="30%" stop-color="#39ff14"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="rim-bevel-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim-bevel-lo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="tooth-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="box-3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="rim-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#00e5ff" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#39ff14" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.7" flood-color="#022c22" flood-opacity="0.55"/>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#00e5ff" flood-opacity="0.7"/>
    </filter>
    <mask id="outer-ring">
      <rect width="64" height="64" fill="black"/>
      <circle cx="32" cy="32" r="30.2" fill="white"/>
      <circle cx="32" cy="32" r="26.4" fill="black"/>
    </mask>
    <mask id="inner-ring">
      <rect width="64" height="64" fill="black"/>
      <circle cx="32" cy="32" r="26.6" fill="white"/>
      <circle cx="32" cy="32" r="24.6" fill="black"/>
    </mask>
  </defs>

  <circle cx="33.2" cy="33.4" r="30.2" fill="#041016"/>
  <g filter="url(#rim-glow)" mask="url(#outer-ring)">
    <circle cx="32" cy="32" r="30.2" fill="url(#rim-cyan)"/>
    <circle cx="32" cy="32" r="30.2" fill="url(#rim-bevel-hi)" opacity="0.7"/>
    <circle cx="32" cy="32" r="30.2" fill="url(#rim-bevel-lo)" opacity="0.75"/>
  </g>
  <g filter="url(#rim-glow)" mask="url(#inner-ring)">
    <circle cx="32" cy="32" r="26.6" fill="url(#rim-lime)"/>
  </g>
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="#ecfeff" stroke-width="0.7" opacity="0.85"/>
  <circle cx="32" cy="32" r="24.6" fill="url(#face-black)"/>
  <ellipse cx="26" cy="20" rx="7" ry="3.2" fill="#fff" opacity="0.07"/>

  <g transform="translate(14 18)" filter="url(#inner-glow)">
    <path d="M2 26 L2 18 L12 6 L22 18 L32 6 L34 8" fill="none" stroke="#0e7490" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M2 26 L2 18 L12 6 L22 18 L32 6 L34 8 L34 26 Z" fill="url(#tooth-fill)" opacity="0.35"/>
    <path d="M2 18 L12 6 L22 18 L32 6 L34 8" fill="none" stroke="#67f8ff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M1 14.2 H35" stroke="#39ff14" stroke-width="1.35" stroke-dasharray="2.2 1.6" opacity="0.95"/>
    <circle cx="22" cy="18" r="1.7" fill="#facc15"/>
    <path d="M26.5 21.2 L34.2 18.4 L34.2 24.8 L26.5 27.6 Z" fill="url(#box-3d)" opacity="0.9"/>
    <path d="M26.5 21.2 L29.4 19.6 L37.1 16.8 L34.2 18.4 Z" fill="#7dd3fc"/>
    <path d="M34.2 18.4 L37.1 16.8 L37.1 23.2 L34.2 24.8 Z" fill="#1e3a8a"/>
  </g>
</svg>
